<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Счёт в эфире</title>
<style>
  html, body { margin:0; background:transparent; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
  #bar { display:inline-flex; align-items:stretch; margin:16px; border-radius:10px; overflow:hidden; box-shadow:0 2px 10px rgba(0,0,0,.45); color:#fff; font-weight:700; }
  .name { background:#1b2430; padding:10px 16px; font-size:26px; display:flex; align-items:center; max-width:260px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pts { background:#ffd21f; color:#111; padding:6px 14px; font-size:40px; min-width:64px; text-align:center; font-variant-numeric: tabular-nums; display:flex; align-items:center; justify-content:center; }
  .sets { background:#0e141b; padding:4px 12px; display:flex; flex-direction:column; justify-content:center; font-size:18px; text-align:center; gap:2px; }
  .sets small { font-weight:600; font-size:11px; opacity:.75; letter-spacing:.06em; text-transform:uppercase; }
</style>
</head>
<body>
<div id="bar">
  <div class="name" id="nUs">Наши</div><div class="pts" id="pUs">0</div>
  <div class="sets" id="mid" hidden><small>партии</small><span id="sets">0 : 0</span></div>
  <div class="pts" id="pThem">0</div><div class="name" id="nThem">Соперник</div>
</div>
<script>
// Адрес, откуда плашка берёт счёт. Если у приложения на Replit изменится адрес, поменяйте только эту строку.
const SCORE_URL = 'https://kamiera-tablo-fast-api--cheburek46.replit.app/score';

async function tick() {
  try {
    const sc = await (await fetch(SCORE_URL, { cache: 'no-store' })).json();
    document.getElementById('nUs').textContent = sc.us.name;
    document.getElementById('nThem').textContent = sc.them.name;
    document.getElementById('pUs').textContent = sc.us.points;
    document.getElementById('pThem').textContent = sc.them.points;
    document.getElementById('mid').hidden = !sc.show_sets;
    document.getElementById('sets').textContent = sc.us.sets + ' : ' + sc.them.sets;
  } catch (e) { /* оставляем прошлые цифры */ }
}
tick(); setInterval(tick, 1000);
</script>
</body>
</html>
